# Local run that mirrors production: the app image + Postgres.
#   cp .env.example .env   (add OPENAI_API_KEY)
#   docker compose up --build   ->  http://localhost:8000
services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://tellwind:tellwind@db:5432/tellwind
      PUBLIC_URL: http://localhost:8000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tellwind
      POSTGRES_PASSWORD: tellwind
      POSTGRES_DB: tellwind
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tellwind"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
