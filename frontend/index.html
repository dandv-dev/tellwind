<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/brand/logo/svg/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/logo/png/favicon-32.png" />
    <link rel="apple-touch-icon" href="/brand/logo/png/apple-touch-icon.png" />
    <meta name="theme-color" content="#12202E" />
    <meta name="description" content="Tellwind gives small teams a daily read on the subject they follow: which topics are rising, holding steady or fading, and why." />
    <title>Tellwind: a daily read on what's moving in your field</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("tw-theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
